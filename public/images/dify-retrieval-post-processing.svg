<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Dify 知识检索性能优化（二）</title><desc id="d">后处理优化示意：评分阶段已有分数直接复用，否则按需准备查询向量；引用组装阶段只读取六个文档字段。</desc><rect width="1000" height="620" fill="#f3f2eb"/><g font-family="system-ui,Microsoft YaHei,sans-serif"><text x="60" y="67" font-size="16" letter-spacing="3" fill="#76796c">ENGINEERING NOTES / 02</text><text x="60" y="132" font-size="39" font-weight="600" fill="#242920">检索完成之后，还能少做些什么？</text><text x="60" y="174" font-size="20" fill="#77796f">Dify 知识检索性能优化（二） · PR #43665</text><rect x="60" y="220" width="422" height="290" rx="12" fill="#fffdf7" stroke="#d2d6c8"/><rect x="518" y="220" width="422" height="290" rx="12" fill="#fffdf7" stroke="#d2d6c8"/><text x="88" y="264" font-size="17" fill="#70835d">01 / 加权评分</text><text x="546" y="264" font-size="17" fill="#70835d">02 / 来源引用</text><text x="88" y="311" font-size="27" fill="#293024">已有分数，直接复用</text><text x="546" y="311" font-size="27" fill="#293024">只读需要的文档字段</text><rect x="88" y="348" width="366" height="59" rx="6" fill="#e8edde"/><text x="271" y="386" font-size="20" text-anchor="middle" fill="#42603b">缺少分数时，才准备查询向量</text><rect x="546" y="348" width="366" height="59" rx="6" fill="#e8edde"/><text x="729" y="386" font-size="20" text-anchor="middle" fill="#42603b">按需加载 6 字段 + raiseload</text><text x="88" y="455" font-size="17" fill="#77796f">先查缓存 · 本次调用内复用向量</text><text x="546" y="455" font-size="17" fill="#77796f">限定读取范围 · 避免隐式补查</text><path d="M60 550H940" stroke="#d2d6c8"/><text x="60" y="585" font-size="16" fill="#77796f">减少准备与读取开销，保留评分、排序和引用内容。</text><text x="940" y="585" text-anchor="end" font-size="16" fill="#70835d">Leslie / leslie2046</text></g></svg>
